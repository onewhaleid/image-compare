<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>image-compare</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 18px;
      }
      .layout {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .left-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 170px;
      }
      .right-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      canvas {
        border: 1px solid #999;
      }
      #matches {
        max-width: 100%;
      }
      .controls {
        margin-bottom: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      label {
        font-size: 90%;
      }
      button {
        padding: 6px 10px;
      }
      input[type="text"] {
        padding: 6px 8px;
        min-width: 180px;
      }
      select, input[type="number"], input[type="color"] {
        padding: 4px 6px;
      }

      /* Drag & drop styles */
      .dropzone {
        width: 150px;
        height: 100px;
        border: 2px dashed #bbb;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        background: #fafafa;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }
      .dropzone.dragover {
        border-color: #4a90e2;
        background: #f0f8ff;
        color: #111;
      }
      .dropzone.small {
        width: 200px;
        height: 150px;
      }
      .hidden-input {
        display: none;
      }

      /* preview canvas inside dropzone */
      .dropzone canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      .drop-instruction {
        position: absolute;
        pointer-events: none;
        text-align: center;
        width: 100%;
      }

      /* Vertical stack of dropzones */
      #dropContainer {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .dropzone-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .overlay-text-input {
        width: 150px;
        box-sizing: border-box;
      }

      /* slider styling */
      .fps-control {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .fps-control input[type="range"] {
        width: 150px;
      }

      /* Canvas container with resize handle */
      .canvas-container {
        position: relative;
        display: inline-block;
        /* match canvas border visually */
        border: 1px solid #999;
      }
      .canvas-container canvas {
        display: block; /* remove inline gaps */
      }
      .resize-handle {
        position: absolute;
        width: 14px;
        height: 14px;
        right: 0;
        bottom: 0;
        cursor: se-resize;
        background: linear-gradient(135deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.15) 50%),
                    linear-gradient(135deg, rgba(0,0,0,0) 70%, rgba(0,0,0,0.15) 70%);
        background-size: 100% 100%, 100% 100%;
        background-repeat: no-repeat;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="left-panel">
        <div><strong>Input images</strong></div>
        <div id="dropContainer"></div>
      </div>

      <div class="right-panel">
        <div class="controls">
          <div>
            <button id="alignBtn">Align</button>
          </div>

          <div class="fps-control">
            <label for="fpsSlider">FPS:</label>
            <input id="fpsSlider" type="range" min="1" max="30" value="2" step="1" />
            <span id="fpsValue">2 fps</span>
            <button id="pauseBtn">Play</button>
          </div>

          <div class="fps-control">
            <label for="gifName">GIF filename:</label>
            <input id="gifName" type="text" placeholder="animation.gif" />
            <label for="gifScale">Resolution:</label>
            <input id="gifScale" type="range" min="1" max="4" value="2" step="1" />
            <span id="gifScaleValue">2x</span>
            <button id="exportGifBtn">Export GIF</button>
            <button id="downloadFramesBtn">Export frames</button>
          </div>

          <div class="fps-control">
            <label><input id="overlayEnabled" type="checkbox" checked /> Text overlay</label>
          </div>
          <div class="fps-control" id="overlayStyleControls" style="display:none;">
            <label for="overlaySize">Size:</label>
            <input id="overlaySize" type="number" min="8" max="200" value="24" style="width:72px;" />
            <label for="overlayColor">Colour:</label>
            <input id="overlayColor" type="color" value="#ffffff" />
            <label><input id="overlayOutlineEnabled" type="checkbox" checked /> Outline</label>
            <label for="overlayOutlineColor">Outline colour:</label>
            <input id="overlayOutlineColor" type="color" value="#000000" />
            <label for="overlayPosition">Position:</label>
            <select id="overlayPosition">
              <option value="top-left">Top left</option>
              <option value="top-center">Top center</option>
              <option value="top-right">Top right</option>
              <option value="bottom-left">Bottom left</option>
              <option value="bottom-center">Bottom center</option>
              <option value="bottom-right" selected>Bottom right</option>
              <option value="center">Center</option>
            </select>
          </div>
        </div>

        <div><strong>Composite</strong></div>
        <div class="row">
          <div class="canvas-container" id="animationContainer">
            <canvas id="animation" width="800" height="300"></canvas>
            <div class="resize-handle" id="resizeHandle" title="Resize"></div>
          </div>
        </div>
      </div>
    </div>

    <script
      async
      src="https://docs.opencv.org/4.x/opencv.js"
      onload="onOpenCvReady();"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

    <script>
      let srcImg = null,
        tgtImg = null;
      
      const dropContainer = document.getElementById("dropContainer");
      const dropZones = [];
      const alignBtn = document.getElementById("alignBtn");

      const gifNameInput = document.getElementById("gifName");
      const exportGifBtn = document.getElementById("exportGifBtn");
      const gifScaleSlider = document.getElementById("gifScale");
      const gifScaleValue = document.getElementById("gifScaleValue");
      const overlayEnabledInput = document.getElementById("overlayEnabled");
      const overlayStyleControls = document.getElementById("overlayStyleControls");
      const overlaySizeInput = document.getElementById("overlaySize");
      const overlayColorInput = document.getElementById("overlayColor");
      const overlayOutlineEnabledInput = document.getElementById("overlayOutlineEnabled");
      const overlayOutlineColorInput = document.getElementById("overlayOutlineColor");
      const overlayPositionInput = document.getElementById("overlayPosition");
      let gifNameAutofill = true;
      let firstImageStem = null;

      // FPS controls
      const fpsSlider = document.getElementById("fpsSlider");
      const fpsValue = document.getElementById("fpsValue");
      const pauseBtn = document.getElementById("pauseBtn");

      // Dynamic dropzones: create as needed and append to container
      function createDropzone() {
        const item = document.createElement("div");
        item.className = "dropzone-item";

        const dropElem = document.createElement("div");
        dropElem.className = "dropzone";

        const instruction = document.createElement("div");
        instruction.className = "drop-instruction";
        instruction.textContent = "Drop image or click to select";
        dropElem.appendChild(instruction);

        const canvas = document.createElement("canvas");
        canvas.className = "preview-canvas";
        dropElem.appendChild(canvas);

        const inputElem = document.createElement("input");
        inputElem.type = "file";
        inputElem.accept = "image/*";
        inputElem.className = "hidden-input";
        dropElem.appendChild(inputElem);

        const overlayInput = document.createElement("input");
        overlayInput.type = "text";
        overlayInput.className = "overlay-text-input";
        overlayInput.placeholder = "Text for this image";
        overlayInput.style.display = overlayEnabledInput && overlayEnabledInput.checked ? "block" : "none";

        item.appendChild(dropElem);
        item.appendChild(overlayInput);
        dropContainer.appendChild(item);
        addDnDHandlers(dropElem, inputElem, canvas);
        dropZones.push({ item, dropElem, inputElem, canvas, overlayInput });
        return { item, dropElem, inputElem, canvas, overlayInput };
      }

      function allDropzonesFilled() {
        return dropZones.length > 0 && dropZones.every(z => z.dropElem.classList.contains("filled"));
      }

      function ensureExtraSlot() {
        if (allDropzonesFilled()) {
          createDropzone();
        }
      }

      function stemFromFilename(name) {
        if (!name) return "animation";
        const lastDot = name.lastIndexOf('.');
        return lastDot > 0 ? name.slice(0, lastDot) : name;
      }

      function setDefaultGifName(stem) {
        if (!gifNameInput) return;
        const trimmed = gifNameInput.value.trim();
        if (gifNameAutofill || trimmed.length === 0) {
          gifNameInput.value = `${stem || "animation"}.gif`;
          gifNameAutofill = true;
        }
      }

      function getOverlayStyle() {
        const size = Math.max(8, Number(overlaySizeInput && overlaySizeInput.value) || 24);
        const color = (overlayColorInput && overlayColorInput.value) || "#ffffff";
        const outlineEnabled = !overlayOutlineEnabledInput || overlayOutlineEnabledInput.checked;
        const outlineColor = (overlayOutlineColorInput && overlayOutlineColorInput.value) || "#000000";
        const position = (overlayPositionInput && overlayPositionInput.value) || "bottom-right";
        const enabled = !overlayEnabledInput || overlayEnabledInput.checked;
        return { enabled, size, color, outlineEnabled, outlineColor, position };
      }

      function updateOverlayUiVisibility() {
        const visible = !!(overlayEnabledInput && overlayEnabledInput.checked);
        if (overlayStyleControls) {
          overlayStyleControls.style.display = visible ? "flex" : "none";
        }
        dropZones.forEach((z) => {
          if (z && z.overlayInput) {
            z.overlayInput.style.display = visible ? "block" : "none";
          }
        });
      }

      function drawOverlayText(ctx, canvasW, canvasH, text, style) {
        if (!style || !style.enabled) return;
        if (!text || !String(text).trim()) return;
        const cleanText = String(text).trim();
        const margin = Math.max(8, Math.round(style.size * 0.35));
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = `700 ${style.size}px Arial, sans-serif`;
        ctx.fillStyle = style.color;
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
        const metrics = ctx.measureText(cleanText);
        const textW = metrics.width;
        const ascent = metrics.actualBoundingBoxAscent || style.size * 0.8;
        const descent = metrics.actualBoundingBoxDescent || style.size * 0.2;
        let x = margin;
        let y = margin + ascent;
        if (style.position === "top-right") {
          x = canvasW - margin - textW;
          y = margin + ascent;
        } else if (style.position === "top-center") {
          x = (canvasW - textW) / 2;
          y = margin + ascent;
        } else if (style.position === "bottom-left") {
          x = margin;
          y = canvasH - margin - descent;
        } else if (style.position === "bottom-center") {
          x = (canvasW - textW) / 2;
          y = canvasH - margin - descent;
        } else if (style.position === "bottom-right") {
          x = canvasW - margin - textW;
          y = canvasH - margin - descent;
        } else if (style.position === "center") {
          x = (canvasW - textW) / 2;
          y = (canvasH + ascent - descent) / 2;
        }
        x = Math.max(0, Math.min(canvasW - textW, x));
        y = Math.max(ascent, Math.min(canvasH - descent, y));
        if (style.outlineEnabled) {
          ctx.strokeStyle = style.outlineColor || "#000000";
          ctx.lineWidth = Math.max(2, Math.round(style.size * 0.12));
          ctx.lineJoin = "round";
          ctx.strokeText(cleanText, x, y);
        }
        ctx.fillText(cleanText, x, y);
        ctx.restore();
      }

      const animationCanvas = document.getElementById("animation");
      const animationContainer = document.getElementById("animationContainer");
      const resizeHandle = document.getElementById("resizeHandle");

      // Set animation canvas size to fit viewport width while preserving aspect ratio
      function setCanvasViewportForSize(imgW, imgH) {
        // Fit based on available viewport height, not width
        const containerRect = animationContainer.getBoundingClientRect();
        const marginBelow = 20; // breathing room at bottom
        const availH = Math.max(200, Math.floor(window.innerHeight - containerRect.top - marginBelow));
        const scale = Math.min(1, availH / imgH);
        // Only auto-size if user has not resized manually
        if (!_toggleState || !_toggleState.userSized) {
          animationCanvas.height = Math.round(imgH * scale);
          animationCanvas.width = Math.round(imgW * scale);
        }
      }

      // Utility to prevent default drag behavior
      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }
      function addDnDHandlers(dropElem, inputElem, canvas) {
        ["dragenter", "dragover", "dragleave", "drop"].forEach((evt) =>
          dropElem.addEventListener(evt, preventDefaults, false)
        );
        ["dragenter", "dragover"].forEach((evt) =>
          dropElem.addEventListener(evt, () => dropElem.classList.add("dragover"))
        );
        ["dragleave", "drop"].forEach((evt) =>
          dropElem.addEventListener(evt, () => dropElem.classList.remove("dragover"))
        );

        dropElem.addEventListener(
          "drop",
          (e) => {
            const dt = e.dataTransfer;
            const file = dt && dt.files && dt.files[0];
            if (file) loadFileToCanvas(file, canvas, dropElem);
          },
          false
        );

        // click opens file dialog as fallback
        dropElem.addEventListener("click", () => inputElem.click());
        inputElem.addEventListener("change", () => {
          const file = inputElem.files && inputElem.files[0];
          if (file) loadFileToCanvas(file, canvas, dropElem);
          inputElem.value = ""; // reset
        });
      }
      
      // Initialize with two empty dropzones
      createDropzone();
      createDropzone();

      if (gifNameInput) {
        gifNameInput.addEventListener('input', () => {
          gifNameAutofill = false;
        });
      }

      function loadFileToCanvas(file, canvas, dropElem, callback) {
        if (!file) return;
        const img = new Image();
        img.onload = () => {
          // Create a hidden full-resolution canvas for processing and animation
          const fullCanvas = document.createElement('canvas');
          fullCanvas.width = img.width;
          fullCanvas.height = img.height;
          const fullCtx = fullCanvas.getContext('2d');
          fullCtx.drawImage(img, 0, 0);

          // Draw a scaled preview into the visible dropzone canvas for UI
          const ctx = canvas.getContext("2d");
          const maxPreviewW = 800;
          const maxPreviewH = 600;
          canvas.width = Math.min(img.width, maxPreviewW);
          canvas.height = Math.min(img.height, maxPreviewH);
          const scale = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, w, h);

          // remove instruction overlay if present
          const instr = dropElem.querySelector(".drop-instruction");
          if (instr) instr.remove();

          // mark as filled and ensure there is always an extra empty slot
          dropElem.classList.add("filled");
          ensureExtraSlot();

          // auto-set GIF name stem from the first loaded image
          if (!firstImageStem && file && file.name) {
            firstImageStem = stemFromFilename(file.name);
          }
          if (firstImageStem) {
            setDefaultGifName(firstImageStem);
          }

          // Attach full-res canvas to the corresponding dropzone entry
          const dz = dropZones.find(z => z.canvas === canvas);
          if (dz) dz.fullCanvas = fullCanvas;

          URL.revokeObjectURL(img.src);
          callback && callback();
        };
        img.onerror = () => {
          console.error("Failed to load image file.");
        };
        img.src = URL.createObjectURL(file);
      }

      function onOpenCvReady() {
        if (typeof cv === "undefined") {
          console.error("OpenCV.js script failed to load.");
          return;
        }
        if (cv.getBuildInformation !== undefined) {
          console.log("OpenCV.js ready:", cv.getBuildInformation());
        } else {
          cv['onRuntimeInitialized'] = () => {
            console.log("OpenCV.js ready:", cv.getBuildInformation());
          };
        }
      }

      function canvasToMat(canvas) {
        const ctx = canvas.getContext("2d");
        if (canvas.width === 0 || canvas.height === 0)
          return new cv.Mat(); // empty
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let mat = cv.matFromImageData(imgData);
        return mat;
      }

      function matToCanvas(mat, canvas) {
        const ctx = canvas.getContext("2d");
        const img = new ImageData(
          new Uint8ClampedArray(mat.data),
          mat.cols,
          mat.rows
        );
        canvas.width = mat.cols;
        canvas.height = mat.rows;
        ctx.putImageData(img, 0, 0);
      }

      // Create a scaled copy of a canvas limited by maxDim, preserving aspect ratio.
      // Returns { canvas, scale }, where scale is the factor applied to original.
      function makeScaledCanvas(sourceCanvas, maxDim = 800) {
        const s = Math.min(maxDim / sourceCanvas.width, maxDim / sourceCanvas.height, 1);
        if (s === 1) return { canvas: sourceCanvas, scale: 1 };
        const c = document.createElement('canvas');
        c.width = Math.round(sourceCanvas.width * s);
        c.height = Math.round(sourceCanvas.height * s);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(sourceCanvas, 0, 0, c.width, c.height);
        return { canvas: c, scale: s };
      }

      function alignImages() {
        if (typeof cv === "undefined") {
          alert("OpenCV.js not ready");
          return;
        }
        const filled = dropZones.filter(z => z.fullCanvas && z.fullCanvas.width > 0 && z.fullCanvas.height > 0);
        if (filled.length < 2) {
          alert("Load at least two images (fill two drop zones).");
          return;
        }

        // Reference is the first filled image; align all others to it
        const refCanvas = filled[0].fullCanvas;
        const others = filled.slice(1).map(z => z.fullCanvas);

        // Helper: compute warped canvas aligning srcCanvas to refCanvas
        function warpToReference(srcCanvas, refCanvas) {
          // Full-resolution mats for final warping
          let src = canvasToMat(srcCanvas);
          let ref = canvasToMat(refCanvas);
          if (src.empty() || ref.empty()) {
            src.delete && src.delete();
            ref.delete && ref.delete();
            return null;
          }
          // Downscale for feature detection/matching to improve performance
          const scaledSrc = makeScaledCanvas(srcCanvas, 800);
          const scaledRef = makeScaledCanvas(refCanvas, 800);
          let srcSmall = canvasToMat(scaledSrc.canvas);
          let refSmall = canvasToMat(scaledRef.canvas);
          let graySrc = new cv.Mat(), grayRef = new cv.Mat();
          cv.cvtColor(srcSmall, graySrc, cv.COLOR_RGBA2GRAY);
          cv.cvtColor(refSmall, grayRef, cv.COLOR_RGBA2GRAY);
          let orb = new cv.ORB();
          let kpSrc = new cv.KeyPointVector();
          let kpRef = new cv.KeyPointVector();
          let desSrc = new cv.Mat();
          let desRef = new cv.Mat();
          orb.detectAndCompute(graySrc, new cv.Mat(), kpSrc, desSrc);
          orb.detectAndCompute(grayRef, new cv.Mat(), kpRef, desRef);

          if (desSrc.rows === 0 || desRef.rows === 0) {
            [graySrc, grayRef, orb, kpSrc, kpRef, desSrc, desRef, srcSmall, refSmall, src, ref].forEach(x => x.delete && x.delete());
            return null;
          }

          let bf = new cv.BFMatcher(cv.NORM_HAMMING, false);
          let matches = new cv.DMatchVector();
          bf.match(desSrc, desRef, matches);
          const mArr = [];
          for (let i = 0; i < matches.size(); i++) mArr.push(matches.get(i));
          mArr.sort((a, b) => a.distance - b.distance);
          const keep = Math.min(200, Math.max(10, Math.floor(mArr.length * 0.3)));
          const goodMatches = new cv.DMatchVector();
          for (let i = 0; i < keep; i++) goodMatches.push_back(mArr[i]);
          if (goodMatches.size() < 4) {
            [graySrc, grayRef, orb, kpSrc, kpRef, desSrc, desRef, bf, matches, goodMatches, srcSmall, refSmall, src, ref].forEach(x => x.delete && x.delete());
            return null;
          }
          let srcPts = new cv.Mat(goodMatches.size(), 1, cv.CV_32FC2);
          let dstPts = new cv.Mat(goodMatches.size(), 1, cv.CV_32FC2);
          for (let i = 0; i < goodMatches.size(); i++) {
            const m = goodMatches.get(i);
            const pS = kpSrc.get(m.queryIdx).pt;
            const pR = kpRef.get(m.trainIdx).pt;
            srcPts.floatPtr(i, 0)[0] = pS.x;
            srcPts.floatPtr(i, 0)[1] = pS.y;
            dstPts.floatPtr(i, 0)[0] = pR.x;
            dstPts.floatPtr(i, 0)[1] = pR.y;
          }
          const mask = new cv.Mat();
          const H = cv.findHomography(srcPts, dstPts, cv.RANSAC, 5, mask);
          if (H.empty()) {
            [graySrc, grayRef, orb, kpSrc, kpRef, desSrc, desRef, bf, matches, goodMatches, srcPts, dstPts, mask, srcSmall, refSmall, src, ref].forEach(x => x.delete && x.delete());
            return null;
          }
          // Lift homography from small scale to full resolution
          const sSrc = scaledSrc.scale; // small = sSrc * full
          const sRef = scaledRef.scale; // small = sRef * full
          const h = H.data64F || H.data32F;
          const HfullArr = new Float64Array(9);
          HfullArr[0] = (1 / sRef) * h[0] * sSrc;
          HfullArr[1] = (1 / sRef) * h[1] * sSrc;
          HfullArr[2] = (1 / sRef) * h[2];
          HfullArr[3] = (1 / sRef) * h[3] * sSrc;
          HfullArr[4] = (1 / sRef) * h[4] * sSrc;
          HfullArr[5] = (1 / sRef) * h[5];
          HfullArr[6] = h[6] * sSrc;
          HfullArr[7] = h[7] * sSrc;
          HfullArr[8] = h[8];
          const Hfull = cv.matFromArray(3, 3, cv.CV_64F, HfullArr);

          // Warp full-resolution src to full-resolution ref size
          let warped = new cv.Mat();
          const dsize = new cv.Size(ref.cols, ref.rows);
          cv.warpPerspective(src, warped, Hfull, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

          // Convert to canvas
          const out = document.createElement('canvas');
          matToCanvas(warped, out);

          [graySrc, grayRef, orb, desSrc, desRef, bf, matches, srcPts, dstPts, mask, H, Hfull, srcSmall, refSmall, warped].forEach(x => x.delete && x.delete());
          kpSrc.delete();
          kpRef.delete();
          src.delete();
          ref.delete();
          goodMatches.delete();
          return out;
        }

        // Build frames: first the reference, then each warped to reference (skip nulls)
        const frames = [refCanvas];
        const frameSourceIndices = [0];
        const frameTexts = [
          filled[0].overlayInput && filled[0].overlayInput.value
            ? filled[0].overlayInput.value.trim()
            : ""
        ];
        for (let i = 0; i < others.length; i++) {
          const warpedCanvas = warpToReference(others[i], refCanvas);
          if (warpedCanvas) {
            frames.push(warpedCanvas);
            const txt = filled[i + 1].overlayInput && filled[i + 1].overlayInput.value
              ? filled[i + 1].overlayInput.value.trim()
              : "";
            frameTexts.push(txt);
            frameSourceIndices.push(i + 1);
          }
        }

        // If only reference, nothing to animate
        if (frames.length < 2) {
          const ctx = animationCanvas.getContext('2d');
          setCanvasViewportForSize(refCanvas.width, refCanvas.height);
          ctx.clearRect(0, 0, animationCanvas.width, animationCanvas.height);
          ctx.drawImage(refCanvas, 0, 0);
          return;
        }

        // Start slideshow across all frames
        startSlideshowFromCanvases(frames, Number(fpsSlider.value), frameTexts, frameSourceIndices).catch(e => console.error(e));
      }

      alignBtn.addEventListener("click", alignImages);

      // Toggle state object used to manage animation interval/bitmaps/fps/pause
      let _toggleState = null;
      function stopToggle() {
        if (!_toggleState) return;
        try {
          if (_toggleState.timer) clearInterval(_toggleState.timer);
          if (_toggleState.bitmaps)
            _toggleState.bitmaps.forEach((b) => b && b.close());
        } catch (e) {
          console.error("Error stopping toggle:", e);
        }
        _toggleState = null;
        pauseBtn.textContent = "Pause";
      }

      async function startSlideshowFromCanvases(canvases, fps = 2, frameTexts = [], frameSourceIndices = []) {
        stopToggle();
        try {
          const bitmaps = await Promise.all(canvases.map(c => createImageBitmap(c)));
          const ctx = animationCanvas.getContext("2d");
          const maxW = Math.max(...bitmaps.map(b => b.width));
          const maxH = Math.max(...bitmaps.map(b => b.height));
          setCanvasViewportForSize(maxW, maxH);

          // initialize toggle state
          _toggleState = {
            bitmaps,
            ctx,
            fps: Math.max(1, Math.floor(fps)),
            paused: false,
            frameIndex: 0,
            frameTexts,
            frameSourceIndices,
            timer: null,
            // autoFit keeps the image fully in view unless the user pans/zooms
            view: { scale: 1, tx: 0, ty: 0, autoFit: true },
            frameDelay: Math.max(20, Math.round(1000 / Math.max(1, Math.floor(fps)))),
            overlayStyle: getOverlayStyle()
          };

          function fitViewToBitmap(bmp, returnOnly = false) {
            if (!_toggleState || !bmp) return null;
            const fitScale = Math.min(
              animationCanvas.width / bmp.width,
              animationCanvas.height / bmp.height
            );
            const view = _toggleState.view;
            const tx = (animationCanvas.width - bmp.width * fitScale) / 2;
            const ty = (animationCanvas.height - bmp.height * fitScale) / 2;
            if (!returnOnly) {
              view.scale = fitScale;
              view.tx = tx;
              view.ty = ty;
            }
            return { scale: fitScale, tx, ty };
          }
          _toggleState.fitViewToBitmap = fitViewToBitmap;

          function drawCurrentFrame(advance = false) {
            if (!_toggleState) return;
            const { bitmaps, view } = _toggleState;
            if (!bitmaps || bitmaps.length === 0) return;
            const bmp = bitmaps[_toggleState.frameIndex % bitmaps.length];
            if (view.autoFit) {
              fitViewToBitmap(bmp);
            }
            const ctxLocal = _toggleState.ctx;
            ctxLocal.clearRect(0, 0, animationCanvas.width, animationCanvas.height);
            ctxLocal.save();
            ctxLocal.setTransform(view.scale, 0, 0, view.scale, view.tx, view.ty);
            // Disable smoothing to keep native pixel detail when zooming in
            ctxLocal.imageSmoothingEnabled = false;
            ctxLocal.drawImage(bmp, 0, 0);
            ctxLocal.restore();
            const text = _toggleState.frameTexts && _toggleState.frameTexts.length
              ? (_toggleState.frameTexts[_toggleState.frameIndex % _toggleState.frameTexts.length] || "")
              : "";
            drawOverlayText(
              ctxLocal,
              animationCanvas.width,
              animationCanvas.height,
              text,
              _toggleState.overlayStyle || getOverlayStyle()
            );
            if (advance) {
              _toggleState.frameIndex = (_toggleState.frameIndex + 1) % bitmaps.length;
            }
          }

          _toggleState.drawCurrent = (advance = false) => drawCurrentFrame(advance);

          function setTimer() {
            if (!_toggleState) return;
            if (_toggleState.timer) clearInterval(_toggleState.timer);
            const period = _toggleState.frameDelay;
            _toggleState.timer = setInterval(() => {
              _toggleState.drawCurrent(true);
            }, period);
          }

          // draw initial frame and start interval
          fitViewToBitmap(bitmaps[0]);
          _toggleState.drawCurrent(true);
          setTimer();

          // Adjust viewport on window resize and keep view scale within min
          const onResize = () => {
            if (!_toggleState) return;
            // Respect manual canvas sizing
            if (!_toggleState.userSized) {
              setCanvasViewportForSize(maxW, maxH);
            }
            const bitmapsLocal = _toggleState.bitmaps;
            const bmp = bitmapsLocal[_toggleState.frameIndex % bitmapsLocal.length];
            const minScale = Math.min(animationCanvas.width / bmp.width, animationCanvas.height / bmp.height);
            if (_toggleState.view) {
              if (_toggleState.view.autoFit) {
                fitViewToBitmap(bmp);
              } else {
                _toggleState.view.scale = Math.max(_toggleState.view.scale, minScale);
              }
            }
            _toggleState.drawCurrent(false);
          };
          window.addEventListener('resize', onResize);
        } catch (e) {
          console.error("Failed to start toggle:", e);
        }
      }

      // update fps display and, if running, update the running timer
      function updateFpsDisplay(val) {
        fpsValue.textContent = val + " fps";
      }

      function updateRunningFps(newFps) {
        if (!_toggleState) return;
        _toggleState.fps = Math.max(1, Math.floor(newFps));
        _toggleState.frameDelay = Math.max(20, Math.round(1000 / _toggleState.fps));
        if (_toggleState.paused) return;
        // recreate interval preserving state
        if (_toggleState.timer) clearInterval(_toggleState.timer);
        const period = _toggleState.frameDelay;
        _toggleState.timer = setInterval(() => {
          if (!_toggleState) return;
          _toggleState.drawCurrent(true);
        }, period);
      }

      async function exportGifFromComposite() {
        console.log("exportGifFromComposite called");
        if (typeof GIF === "undefined") {
          console.error("GIF library not loaded");
          alert("GIF library not loaded yet.");
          return;
        }
        console.log("GIF library loaded, _toggleState:", _toggleState);
        if (!_toggleState || !_toggleState.bitmaps || _toggleState.bitmaps.length === 0) {
          alert("Run Align first so the composite has frames to export.");
          return;
        }

        const rawName = (gifNameInput && gifNameInput.value.trim()) || `${firstImageStem || "animation"}.gif`;
        const filename = rawName.toLowerCase().endsWith('.gif') ? rawName : `${rawName}.gif`;
        const delay = _toggleState.frameDelay || Math.max(20, Math.round(1000 / Math.max(1, Number(fpsSlider.value) || 2)));
        console.log("Export filename:", filename, "delay:", delay, "num frames:", _toggleState.bitmaps.length);

        const exportScale = Math.max(1, Number(gifScaleSlider && gifScaleSlider.value) || 2);
        const offscreen = document.createElement('canvas');
        offscreen.width = Math.round(animationCanvas.width * exportScale);
        offscreen.height = Math.round(animationCanvas.height * exportScale);
        const offctx = offscreen.getContext('2d');
        const isFileProtocol = window.location.protocol === 'file:';
        let blobWorkerUrl = null;
        const gifOptions = {
          workers: 2,
          quality: 10,
          workerScript: 'gif.worker.js'
        };
        if (isFileProtocol) {
          // file:// pages cannot spawn workers from local file paths.
          // Use a same-origin blob: URL worker that imports gif.js worker from CDN.
          const workerSource =
            "importScripts('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');";
          blobWorkerUrl = URL.createObjectURL(
            new Blob([workerSource], { type: 'application/javascript' })
          );
          gifOptions.workers = 1;
          gifOptions.workerScript = blobWorkerUrl;
        }
        const gif = new GIF(gifOptions);
        console.log("GIF object created");

        const view = _toggleState.view || { scale: 1, tx: 0, ty: 0, autoFit: true };
        const overlayStyle = _toggleState.overlayStyle || getOverlayStyle();
        const fitHelper = _toggleState.fitViewToBitmap;

        _toggleState.bitmaps.forEach((bmp, idx) => {
          if (!bmp) return;
          let scale = view.scale;
          let tx = view.tx;
          let ty = view.ty;
          if (view.autoFit && typeof fitHelper === 'function') {
            const res = fitHelper(bmp, true);
            if (res) {
              scale = res.scale;
              tx = res.tx;
              ty = res.ty;
            }
          }
          offctx.setTransform(1, 0, 0, 1, 0, 0);
          offctx.clearRect(0, 0, offscreen.width, offscreen.height);
          offctx.setTransform(
            scale * exportScale,
            0,
            0,
            scale * exportScale,
            tx * exportScale,
            ty * exportScale
          );
          offctx.imageSmoothingEnabled = false;
          offctx.drawImage(bmp, 0, 0);
          const text = _toggleState.frameTexts && _toggleState.frameTexts.length
            ? (_toggleState.frameTexts[idx % _toggleState.frameTexts.length] || "")
            : "";
          drawOverlayText(
            offctx,
            offscreen.width,
            offscreen.height,
            text,
            {
              enabled: overlayStyle.enabled,
              size: Math.max(8, Math.round((overlayStyle.size || 24) * exportScale)),
              color: overlayStyle.color,
              outlineEnabled: overlayStyle.outlineEnabled,
              outlineColor: overlayStyle.outlineColor,
              position: overlayStyle.position
            }
          );
          gif.addFrame(offscreen, { copy: true, delay });
          console.log("Added frame", idx);
        });
        console.log("All frames added, starting render");

        const originalExportLabel = exportGifBtn ? exportGifBtn.textContent : "";
        let stalledTimer = null;
        let sawProgress = false;
        if (exportGifBtn) {
          exportGifBtn.disabled = true;
          exportGifBtn.textContent = "Rendering GIF...";
        }
        const clearRenderState = () => {
          if (stalledTimer) {
            clearTimeout(stalledTimer);
            stalledTimer = null;
          }
          if (exportGifBtn) {
            exportGifBtn.disabled = false;
            exportGifBtn.textContent = originalExportLabel || "Export GIF";
          }
          if (blobWorkerUrl) {
            URL.revokeObjectURL(blobWorkerUrl);
            blobWorkerUrl = null;
          }
        };
        stalledTimer = setTimeout(() => {
          if (sawProgress) return;
          clearRenderState();
          alert("GIF export stalled. Open DevTools console for details. If possible, run this page from a local server instead of opening the .html directly.");
        }, 15000);

        gif.on('finished', (blob) => {
          clearRenderState();
          console.log("GIF finished, blob size:", blob.size);
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.style.display = 'none';
          document.body.appendChild(a);
          console.log("Triggering download for:", filename);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(url);
            a.remove();
          }, 1000);
        });

        gif.on('error', (err) => {
          clearRenderState();
          console.error('GIF export failed:', err);
          alert('Failed to export GIF: ' + err);
        });

        gif.on('progress', (progress) => {
          sawProgress = true;
          console.log("GIF progress:", progress);
          if (exportGifBtn) {
            const pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
            exportGifBtn.textContent = `Rendering ${pct}%`;
          }
        });

        try {
          gif.render();
        } catch (err) {
          clearRenderState();
          console.error("gif.render() threw:", err);
          alert("Failed to start GIF export: " + (err && err.message ? err.message : err));
          return;
        }
        console.log("gif.render() called");
      }

      // pause/resume toggle
      pauseBtn.addEventListener("click", () => {
        if (!_toggleState) {
          // nothing running — toggle label to Pause (no-op)
          pauseBtn.textContent = "Pause";
          return;
        }
        if (_toggleState.paused) {
          // resume
          _toggleState.paused = false;
          updateRunningFps(_toggleState.fps);
          // draw immediately to reflect resume
          _toggleState.drawCurrent(true);
          pauseBtn.textContent = "Pause";
        } else {
          // pause
          _toggleState.paused = true;
          if (_toggleState.timer) {
            clearInterval(_toggleState.timer);
            _toggleState.timer = null;
          }
          pauseBtn.textContent = "Resume";
        }
      });

      // slider control
      fpsSlider.addEventListener("input", (e) => {
        const v = e.target.value;
        updateFpsDisplay(v);
        updateRunningFps(Number(v));
      });

      // initialize fps UI
      updateFpsDisplay(fpsSlider.value);
      if (gifScaleSlider && gifScaleValue) {
        const updateGifScaleDisplay = (v) => {
          gifScaleValue.textContent = `${v}x`;
        };
        updateGifScaleDisplay(gifScaleSlider.value);
        gifScaleSlider.addEventListener("input", (e) => {
          updateGifScaleDisplay(e.target.value);
        });
      }

      function refreshOverlayStyleAndRedraw() {
        updateOverlayUiVisibility();
        if (!_toggleState) return;
        _toggleState.overlayStyle = getOverlayStyle();
        if (_toggleState.drawCurrent) _toggleState.drawCurrent(false);
      }
      if (overlayEnabledInput) overlayEnabledInput.addEventListener("change", refreshOverlayStyleAndRedraw);
      if (overlaySizeInput) overlaySizeInput.addEventListener("input", refreshOverlayStyleAndRedraw);
      if (overlayColorInput) overlayColorInput.addEventListener("input", refreshOverlayStyleAndRedraw);
      if (overlayOutlineEnabledInput) overlayOutlineEnabledInput.addEventListener("change", refreshOverlayStyleAndRedraw);
      if (overlayOutlineColorInput) overlayOutlineColorInput.addEventListener("input", refreshOverlayStyleAndRedraw);
      if (overlayPositionInput) overlayPositionInput.addEventListener("change", refreshOverlayStyleAndRedraw);
      updateOverlayUiVisibility();

      async function downloadFramesAsJpeg() {
        if (!_toggleState || !_toggleState.bitmaps || _toggleState.bitmaps.length === 0) {
          alert("Run Align first so the composite has frames to export.");
          return;
        }
        const bitmaps = _toggleState.bitmaps;
        const stem = (gifNameInput && gifNameInput.value.trim().replace(/\.gif$/i, '')) || firstImageStem || "frame";
        const exportScale = Math.max(1, Number(gifScaleSlider && gifScaleSlider.value) || 2);
        const overlayStyle = _toggleState.overlayStyle || getOverlayStyle();
        const view = _toggleState.view || { scale: 1, tx: 0, ty: 0, autoFit: true };
        const fitHelper = _toggleState.fitViewToBitmap;
        const downloadFramesBtn = document.getElementById('downloadFramesBtn');
        const originalLabel = downloadFramesBtn ? downloadFramesBtn.textContent : '';
        if (downloadFramesBtn) { downloadFramesBtn.disabled = true; downloadFramesBtn.textContent = 'Downloading...'; }

        const offscreen = document.createElement('canvas');
        offscreen.width = Math.round(animationCanvas.width * exportScale);
        offscreen.height = Math.round(animationCanvas.height * exportScale);
        const offctx = offscreen.getContext('2d');
        const digits = String(bitmaps.length).length;

        try {
          for (let idx = 0; idx < bitmaps.length; idx++) {
            const bmp = bitmaps[idx];
            if (!bmp) continue;
            let scale = view.scale, tx = view.tx, ty = view.ty;
            if (view.autoFit && typeof fitHelper === 'function') {
              const res = fitHelper(bmp, true);
              if (res) { scale = res.scale; tx = res.tx; ty = res.ty; }
            }
            offctx.setTransform(1, 0, 0, 1, 0, 0);
            offctx.clearRect(0, 0, offscreen.width, offscreen.height);
            offctx.setTransform(scale * exportScale, 0, 0, scale * exportScale, tx * exportScale, ty * exportScale);
            offctx.imageSmoothingEnabled = false;
            offctx.drawImage(bmp, 0, 0);
            const text = _toggleState.frameTexts && _toggleState.frameTexts.length
              ? (_toggleState.frameTexts[idx % _toggleState.frameTexts.length] || '')
              : '';
            drawOverlayText(offctx, offscreen.width, offscreen.height, text, {
              enabled: overlayStyle.enabled,
              size: Math.max(8, Math.round((overlayStyle.size || 24) * exportScale)),
              color: overlayStyle.color,
              outlineEnabled: overlayStyle.outlineEnabled,
              outlineColor: overlayStyle.outlineColor,
              position: overlayStyle.position
            });
            const padded = String(idx + 1).padStart(digits, '0');
            const filename = `${stem}_frame${padded}.jpg`;
            if (downloadFramesBtn) downloadFramesBtn.textContent = `Downloading ${idx + 1}/${bitmaps.length}...`;
            await new Promise(resolve => {
              offscreen.toBlob(blob => {
                if (!blob) { resolve(); return; }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(url); a.remove(); resolve(); }, 200);
              }, 'image/jpeg', 0.95);
            });
          }
        } finally {
          if (downloadFramesBtn) { downloadFramesBtn.disabled = false; downloadFramesBtn.textContent = originalLabel; }
        }
      }

      document.getElementById('downloadFramesBtn').addEventListener('click', downloadFramesAsJpeg);

      // Export GIF button listener
      exportGifBtn.addEventListener("click", exportGifFromComposite);

      // helper to get currently filled canvases (those with content)
      function getFilledCanvases() {
        return dropZones
          .filter(z => z.canvas && z.canvas.width > 0 && z.canvas.height > 0)
          .map(z => z.canvas);
      }

      // when user clicks Align, run alignment which will start slideshow
      alignBtn.addEventListener("click", () => {
        stopToggle();
        setTimeout(() => {
          alignImages();
        }, 50);
      });

      // stop toggle when user drops a new file into any dynamic dropzone
      dropContainer.addEventListener("drop", stopToggle, true);
      dropContainer.addEventListener("change", (e) => {
        const t = e.target;
        if (t && t.matches && t.matches('input[type="file"]')) stopToggle();
      }, true);
      dropContainer.addEventListener("input", (e) => {
        const t = e.target;
        if (!(t && t.classList && t.classList.contains("overlay-text-input"))) return;
        if (!_toggleState) return;
        const filled = dropZones.filter(z => z.fullCanvas && z.fullCanvas.width > 0 && z.fullCanvas.height > 0);
        const srcIdx = _toggleState.frameSourceIndices || [];
        if (srcIdx.length > 0) {
          _toggleState.frameTexts = srcIdx.map((i) =>
            filled[i] && filled[i].overlayInput && filled[i].overlayInput.value
              ? filled[i].overlayInput.value.trim()
              : ""
          );
        } else {
          _toggleState.frameTexts = filled.map(z =>
            z.overlayInput && z.overlayInput.value ? z.overlayInput.value.trim() : ""
          );
        }
        if (_toggleState.drawCurrent) _toggleState.drawCurrent(false);
      });

      // Zoom & Pan interactions for Composite canvas
      (function enableZoomPan() {
        let isPanning = false;
        let lastX = 0, lastY = 0;
        const maxScale = 10;

        function getView() {
          if (!_toggleState) return null;
          if (!_toggleState.view) _toggleState.view = { scale: 1, tx: 0, ty: 0 };
          return _toggleState.view;
        }

        function computeMinScale() {
          if (!_toggleState || !_toggleState.bitmaps || _toggleState.bitmaps.length === 0) return 0.1;
          const idx = _toggleState.frameIndex % _toggleState.bitmaps.length;
          const bmp = _toggleState.bitmaps[idx];
          if (!bmp) return 0.1;
          const scaleX = animationCanvas.width / bmp.width;
          const scaleY = animationCanvas.height / bmp.height;
          // Fit-to-canvas minimum: don't allow zooming out smaller than fit
          return Math.min(scaleX, scaleY);
        }

        animationCanvas.addEventListener('wheel', (e) => {
          // Zoom around mouse position
          const view = getView();
          if (!view) return;
          view.autoFit = false; // user manually zoomed
          e.preventDefault();
          const rect = animationCanvas.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;

          const scaleFactor = e.deltaY < 0 ? 1.1 : 0.9;
          const prevScale = view.scale;
          let newScale = prevScale * scaleFactor;
          const minScale = computeMinScale();
          newScale = Math.min(maxScale, Math.max(minScale, newScale));
          if (newScale === prevScale) return;

          const imgX = (mx - view.tx) / prevScale;
          const imgY = (my - view.ty) / prevScale;
          view.scale = newScale;
          view.tx = mx - imgX * newScale;
          view.ty = my - imgY * newScale;

          if (_toggleState && _toggleState.drawCurrent) {
            _toggleState.drawCurrent(false);
          } else {
            const ctx = animationCanvas.getContext('2d');
            ctx.clearRect(0, 0, animationCanvas.width, animationCanvas.height);
          }
        }, { passive: false });

        animationCanvas.addEventListener('mousedown', (e) => {
          const view = getView();
          if (!view) return;
          view.autoFit = false; // user started panning
          isPanning = true;
          lastX = e.clientX;
          lastY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
          if (!isPanning) return;
          const view = getView();
          if (!view) return;
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          view.tx += dx;
          view.ty += dy;
          if (_toggleState && _toggleState.drawCurrent) {
            _toggleState.drawCurrent(false);
          }
        });

        window.addEventListener('mouseup', () => { isPanning = false; });
        animationCanvas.addEventListener('mouseleave', () => { isPanning = false; });

        // Double-click to reset view
        animationCanvas.addEventListener('dblclick', () => {
          const view = getView();
          if (!view) return;
          const minScale = computeMinScale();
          const idx = _toggleState && _toggleState.bitmaps
            ? _toggleState.frameIndex % _toggleState.bitmaps.length
            : 0;
          const bmp = _toggleState && _toggleState.bitmaps ? _toggleState.bitmaps[idx] : null;
          view.scale = minScale;
          if (bmp) {
            view.tx = (animationCanvas.width - bmp.width * minScale) / 2;
            view.ty = (animationCanvas.height - bmp.height * minScale) / 2;
          } else {
            view.tx = 0;
            view.ty = 0;
          }
          view.autoFit = true; // return to auto-fit mode
          if (_toggleState && _toggleState.drawCurrent) {
            _toggleState.drawCurrent(false);
          }
        });
      })();

      // Enable manual resizing via bottom-right handle
      (function enableCanvasResize() {
        if (!resizeHandle) return;
        let resizing = false;
        let startX = 0, startY = 0;
        let startW = 0, startH = 0;

        const MIN_W = 150;
        const MIN_H = 100;

        function redrawAfterResize() {
          if (_toggleState) {
            // Mark as user-sized to prevent auto-resize
            _toggleState.userSized = true;
            // Refresh context in case canvas was resized
            _toggleState.ctx = animationCanvas.getContext('2d');
            const bitmaps = _toggleState.bitmaps;
            if (bitmaps && bitmaps.length) {
              const bmp = bitmaps[_toggleState.frameIndex % bitmaps.length];
              const minScale = Math.min(animationCanvas.width / bmp.width, animationCanvas.height / bmp.height);
              if (_toggleState.view) {
                if (_toggleState.view.autoFit) {
                  // Fit view to new canvas size
                  if (typeof _toggleState.fitViewToBitmap === 'function') {
                    _toggleState.fitViewToBitmap(bmp);
                  }
                } else {
                  _toggleState.view.scale = Math.max(_toggleState.view.scale, minScale);
                }
              }
              _toggleState.drawCurrent(false);
            }
          } else {
            // No slideshow; clear and leave blank
            const ctx = animationCanvas.getContext('2d');
            ctx.clearRect(0, 0, animationCanvas.width, animationCanvas.height);
          }
        }

        resizeHandle.addEventListener('mousedown', (e) => {
          e.preventDefault();
          resizing = true;
          startX = e.clientX;
          startY = e.clientY;
          startW = animationCanvas.width;
          startH = animationCanvas.height;
          document.body.style.cursor = 'se-resize';
        });

        window.addEventListener('mousemove', (e) => {
          if (!resizing) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const newW = Math.max(MIN_W, startW + dx);
          const newH = Math.max(MIN_H, startH + dy);
          // Apply new size to canvas
          animationCanvas.width = Math.round(newW);
          animationCanvas.height = Math.round(newH);
          redrawAfterResize();
        }, { passive: true });

        window.addEventListener('mouseup', () => {
          if (!resizing) return;
          resizing = false;
          document.body.style.cursor = '';
        });
      })();
    </script>
  </body>
</html>
